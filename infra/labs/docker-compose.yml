# The labs stack: all four API services, pulled from SWR.
#
# Started by .github/workflows/deploy-labs.yml on the VM's self-hosted runner:
#
#   IMAGE_TAG=1.0.0-abc1234 docker compose -f infra/labs/docker-compose.yml \
#     up -d --pull always --wait
#
# There is deliberately no `build:` key. The only thing that may run here is an
# image CI produced and pushed — a local build would put bytes on the server
# that no commit corresponds to.

name: request-management-labs

x-common: &common
  restart: unless-stopped
  # Real values live on the VM, outside the repo, so a secret never passes
  # through a workflow log and can be corrected without re-running a pipeline.
  # See .env.labs.example for the full list.
  env_file: /etc/request-management/.backend.env
  networks: [rm-net]
  logging:
    driver: json-file
    options: { max-size: "10m", max-file: "3" }

services:
  user-service:
    <<: *common
    image: ${REGISTRY}/${SWR_ORG}/request-management-user-service:${IMAGE_TAG}
    container_name: rm-user
    # Host 3501 → container 3001. The high ports keep 3000-3002 free on a VM
    # that already uses them, and match the `docker run` commands people use to
    # start these by hand.
    ports: ["3501:3001"]
    healthcheck:
      # user-service's /health is static by design — it reports that the process
      # is answering, nothing more.
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3001/api/v1/health | grep -q '\"status\":\"ok\"'"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  core-service:
    <<: *common
    image: ${REGISTRY}/${SWR_ORG}/request-management-core-service:${IMAGE_TAG}
    container_name: rm-core
    ports: ["3502:3002"]
    # Ordering only. core-service resolves callers through user-service on every
    # request, so it must not refuse to start when user-service is slow — it
    # retries per request. Same for run-number-service, which it calls to issue
    # a document number.
    depends_on: [user-service, run-number-service]
    healthcheck:
      # The body, not the status code: health.repository.ts catches the query
      # error and still answers 200 with `"database":"down"`. A status-code
      # check stays green through a total database outage.
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3002/api/v1/health | grep -q '\"database\":\"up\"'"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  external-service:
    <<: *common
    image: ${REGISTRY}/${SWR_ORG}/request-management-external-service:${IMAGE_TAG}
    container_name: rm-external
    # Host 3503 → container 3003, the same +500 offset as the other two.
    #
    # Unlike 3501 and 3502, this one is published for callers OUTSIDE the VM —
    # chatbots, the Lead intake web form, the workflow engine, MCP clients. They
    # are not on `rm-net`, so they arrive through the host. See §7 Firewall in
    # docs/labs-server-setup.md.
    ports: ["3503:3003"]
    # Ordering only, same reasoning as core-service: it resolves callers through
    # user-service on every request and retries, so it must not refuse to start
    # when user-service is slow.
    #
    # Not on core-service, deliberately. It runs core-service's domain providers
    # in its own process rather than calling them over HTTP, so rm-core being
    # down does not stop it — see services/core-service/src/index.ts. It does
    # depend on run-number-service: those providers issue document numbers.
    depends_on: [user-service, run-number-service]
    healthcheck:
      # The body, not the status code — the same trap as core-service, and for
      # the same reason: this service reaches the database directly, and health
      # answers 200 with `"database":"down"` when it cannot.
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3003/api/v1/health | grep -q '\"database\":\"up\"'"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  run-number-service:
    <<: *common
    image: ${REGISTRY}/${SWR_ORG}/request-management-run-number-service:${IMAGE_TAG}
    container_name: rm-runnumber
    # Host 3504 → container 3004, the same +500 offset. Published for symmetry
    # and for `curl` from the VM only — no caller outside the VM reaches it, so
    # it stays closed at the firewall. See §7 in docs/labs-server-setup.md.
    ports: ["3504:3004"]
    # Ordering only, same reasoning as the others: it resolves callers through
    # user-service on every request and retries.
    depends_on: [user-service]
    healthcheck:
      # The body, not the status code — same trap as core-service: this service
      # reaches the database directly and answers 200 with `"database":"down"`
      # when it cannot.
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3004/api/v1/health | grep -q '\"database\":\"up\"'"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

networks:
  rm-net:
    # External so that no compose project owns it — that is what lets the
    # frontend stack, a separate project, reach these containers by name.
    # The deploy workflow's `Ensure Shared Network` step creates it when it is
    # missing, because `external` also means compose will not.
    external: true
