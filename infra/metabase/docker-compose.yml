# Metabase for CD-10 / CD-92 — executive dashboards over request / approval / SLA.
#
#   docker compose -f infra/metabase/docker-compose.yml up -d
#   → http://localhost:3300
#
# Metabase keeps its own state (users, questions, dashboards) in the bundled
# `metabase-app-db` Postgres, NOT in the application database. It reads the
# application database through the read-only `metabase_ro` role created by
# reporting.sql — apply that file to the app DB first, then register the
# connection in Metabase's admin UI (see docs/metabase.md).
#
# Default port 3300 on purpose: 3000 is reserved for the frontend SPA
# (Keycloak redirect URIs already point there) and 3001/3002 are the services.
# Override with METABASE_PORT where 3300 is taken — on 192.168.31.51 it
# belongs to Loki, so Metabase runs there as 3400.

services:
  metabase:
    image: metabase/metabase:v0.50.26
    container_name: ctd-metabase
    ports:
      - "${METABASE_PORT:-3300}:3000"
    environment:
      MB_DB_TYPE: postgres
      MB_DB_HOST: metabase-app-db
      MB_DB_PORT: 5432
      MB_DB_DBNAME: metabase
      MB_DB_USER: metabase
      MB_DB_PASS: ${METABASE_APP_DB_PASSWORD:-metabase}
      # Thai-friendly defaults; both changeable in the admin UI.
      MB_SITE_LOCALE: th
      JAVA_TIMEZONE: Asia/Bangkok
    depends_on:
      metabase-app-db:
        condition: service_healthy
    # Lets Metabase reach a Postgres running on the host machine as
    # `host.docker.internal` (Docker Desktop on macOS resolves this natively).
    extra_hosts:
      - "host.docker.internal:host-gateway"

  metabase-app-db:
    image: postgres:16-alpine
    container_name: ctd-metabase-app-db
    environment:
      POSTGRES_DB: metabase
      POSTGRES_USER: metabase
      POSTGRES_PASSWORD: ${METABASE_APP_DB_PASSWORD:-metabase}
    volumes:
      - metabase-app-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U metabase -d metabase"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  metabase-app-db-data:
