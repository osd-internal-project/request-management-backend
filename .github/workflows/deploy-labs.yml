# UAT gate. This file keeps the name deploy-labs.yml on purpose: workflow_dispatch only works for a
# workflow file that exists on the default branch, and this is the one main already has. GitHub runs the
# version found on the branch you pick under "Use workflow from", so on deploy-osd-uat it is this one.
# It is never merged: main keeps the real labs workflow.
name: Deploy UAT

on:
  workflow_dispatch:
    inputs:
      service:
        description: 'Service to deploy'
        required: true
        type: choice
        options:
          - run-number
          - user
          - core
          - external
      image_tag:
        description: 'Existing tag to deploy (skips the build)'
        required: false
        type: string

permissions:
  contents: write

jobs:
  run-number:
    if: inputs.service == 'run-number'
    uses: ./.github/workflows/deploy-run-number.yml
    with:
      deploy_env: uat
      image_tag: ${{ inputs.image_tag }}
    secrets: inherit
  user:
    if: inputs.service == 'user'
    uses: ./.github/workflows/deploy-user.yml
    with:
      deploy_env: uat
      image_tag: ${{ inputs.image_tag }}
    secrets: inherit
  core:
    if: inputs.service == 'core'
    uses: ./.github/workflows/deploy-core.yml
    with:
      deploy_env: uat
      image_tag: ${{ inputs.image_tag }}
    secrets: inherit
  external:
    if: inputs.service == 'external'
    uses: ./.github/workflows/deploy-external.yml
    with:
      deploy_env: uat
      image_tag: ${{ inputs.image_tag }}
    secrets: inherit
