# run-number-service (NestJS, port 3004). ClusterIP only: the frontend calls it server-side over the cluster network.
appName: request-run-number-service
ingressName: request-run-number-service-ingress
configmapName: request-run-number-service-config
secretName: request-run-number-service-secret
namespace: request-management

replicaCount: 1

image:
  # The pipeline overrides repository and tag (--set image.repository / image.tag).
  repository: swr.ap-southeast-2.myhuaweicloud.com/osd-internal/request-run-number-be
  tag: "1.0.0"
  pullPolicy: IfNotPresent

imagePullSecretName: huawei-swr-secret

containerPort: 3004

strategy:
  rollingUpdate:
    maxSurge: 1
    maxUnavailable: 0

service:
  type: ClusterIP
  port: 8887
  targetPort: 3004

# No public ingress: nothing outside the cluster calls this service directly.
ingress:
  enabled: false

configmap:
  NODE_ENV: "production"
  RUN_NUMBER_SERVICE_PORT: "3004"
  USER_SERVICE_URL: "http://request-user-service.request-management.svc.cluster.local:8884/api/v1"

# Committed file: every value stays empty. Real values arrive as --set-string secrets.X from the pipeline.
secrets:
  DATABASE_URL: ""

# The runtime image has no Prisma CLI, so there is no migration hook. Apply migrations by hand:
#   DATABASE_URL=<url> yarn prisma:migrate:deploy
migration:
  enabled: false

autoscaling:
  enabled: false

# main.ts: setGlobalPrefix('api/v1'); GET /api/v1/health
livenessProbe:
  enabled: true
  path: /api/v1/health
  initialDelaySeconds: 30
  periodSeconds: 10
  timeoutSeconds: 5

readinessProbe:
  enabled: true
  path: /api/v1/health
  initialDelaySeconds: 10
  periodSeconds: 5
  timeoutSeconds: 3

resources:
  requests:
    memory: "192Mi"
    cpu: "25m"
  limits:
    memory: "384Mi"
    cpu: "500m"
