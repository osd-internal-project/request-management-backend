# UAT (cluster kube-osd-uat). Everything environment specific lives here; values.yaml holds the defaults.
namespace: request-management

replicaCount: 1

# Helm merges maps key by key, so the WHOLE map is written here: a partial one silently keeps a value from values.yaml.
configmap:
  NODE_ENV: "production"
  CORE_SERVICE_PORT: "3002"
  USER_SERVICE_URL: "http://request-user-service.request-management.svc.cluster.local:8884/api/v1"
  RUN_NUMBER_SERVICE_URL: "http://request-run-number-service.request-management.svc.cluster.local:8887/api/v1"
  KEYCLOAK_BASE_URL: "https://auth-events-uat.osd.co.th"
  KEYCLOAK_REALM: "enterprise-request-uat"
  INTEGRATION_CLIENT_ID: "request-integration"
  PUBLIC_WEB_URL: "https://ctd-uat.osd.co.th"
  PDPA_MODE: "mock"
  METABASE_SITE_URL: ""

autoscaling:
  enabled: false

hostAliases:
  # Resolve the shared UAT Keycloak host through the in-cluster Traefik (ClusterIP), not public DNS / WAF.
  - ip: "100.96.0.228"
    hostnames:
      - "auth-events-uat.osd.co.th"
