# BACKEND profile — NestJS core-service. Carries the shared Prisma schema
# (libs/prisma), so it runs the migration hook; request-user-chart does too.
# `prisma migrate deploy` applies only what is pending and takes an advisory
# lock, so whichever deploys first wins and the other is a no-op. There is no
# deploy order between the two charts.

appName: request-core-service
ingressName: request-core-ingress
configmapName: request-core-service-config
secretName: request-core-service-secret
namespace: request-management-prod

replicaCount: 2

image:
  # The pipeline overrides this with --set image.repository=
  repository: swr.ap-southeast-2.myhuaweicloud.com/osd-internal/request-core-be
  # Immutable tag <version>-<short sha>; see request-user-chart for why that is
  # what makes IfNotPresent correct.
  tag: "1.0.0"
  pullPolicy: IfNotPresent

imagePullSecretName: huawei-swr-secret

# services/core-service/Dockerfile: EXPOSE 4005, the process reads
# CORE_SERVICE_PORT (services/core-service/src/configs/index.ts).
containerPort: 4005

strategy:
  rollingUpdate:
    maxSurge: 1
    maxUnavailable: 0

service:
  type: ClusterIP
  port: 8885
  targetPort: 4005

# Same host as request-user-chart and the frontend; the `core` segment selects
# this service and is stripped before the pod sees the request, so
# rewrite-target restates main.ts's setGlobalPrefix('api/v1').
ingress:
  enabled: true
  className: nginx
  host: request-management.osd.co.th
  path: /public/api/v1/core(/|$)(.*)
  pathType: ImplementationSpecific
  tls:
    enabled: true
    secretName: request-management-prod-tls
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    nginx.ingress.kubernetes.io/rewrite-target: /api/v1/$2
    # Requests carry file attachments, and the bearer token is a Keycloak one.
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"
    nginx.ingress.kubernetes.io/proxy-buffer-size: "16k"
    nginx.ingress.kubernetes.io/proxy-buffers-number: "8"
    nginx.ingress.kubernetes.io/proxy-busy-buffers-size: "32k"
    nginx.ingress.kubernetes.io/large-client-header-buffers: "4 32k"

# USER_SERVICE_URL INCLUDES the /api/v1 prefix: remote-principal.service.ts
# appends paths directly (`${baseUrl}/internal/policy/resolve`). It uses
# user-service's service.port (8884), never its containerPort.
configmap:
  NODE_ENV: "production"
  CORE_SERVICE_PORT: "4005"
  USER_SERVICE_URL: "http://request-user-service.request-management-prod.svc.cluster.local:8884/api/v1"
  KEYCLOAK_BASE_URL: "https://auth-request-management.osd.co.th"
  KEYCLOAK_REALM: "enterprise-request"
  INTEGRATION_CLIENT_ID: "request-integration"
  ODOO_MODE: "mock"
  PDPA_MODE: "mock"
  METABASE_SITE_URL: ""
  METABASE_DASHBOARD_REQUEST: "2"
  METABASE_DASHBOARD_APPROVAL: "3"
  METABASE_DASHBOARD_SLA: "4"

# Committed file — every value stays empty. Real values arrive from the
# pipeline as --set-string secrets.X=…
secrets:
  DATABASE_URL: ""
  INTEGRATION_CLIENT_SECRET: ""
  METABASE_EMBED_SECRET: ""

migration:
  enabled: true
  command: "cd /app && npx prisma migrate deploy"
  envFromSecrets:
    - DATABASE_URL
  activeDeadlineSeconds: 300
  backoffLimit: 1

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 3
  targetCPUUtilizationPercentage: 60
  targetMemoryUtilizationPercentage: 70

# main.ts: setGlobalPrefix('api/v1'); health/health.controller.ts @Controller('health').
# This one reports "database":"up" — a real readiness signal, unlike
# user-service's static health.
livenessProbe:
  enabled: true
  path: /api/v1/health
  initialDelaySeconds: 30
  periodSeconds: 10
  timeoutSeconds: 5

readinessProbe:
  enabled: true
  path: /api/v1/health
  initialDelaySeconds: 10
  periodSeconds: 5
  timeoutSeconds: 3

resources:
  requests:
    memory: "256Mi"
    cpu: "100m"
  limits:
    memory: "512Mi"
    cpu: "500m"
