namespace: request-management-sit

replicaCount: 1

ingress:
  host: request-management-sit.osd.co.th
  tls:
    enabled: true
    secretName: request-management-sit-tls

# Helm merges maps key by key, so the WHOLE map is written in every env file —
# a partial one silently keeps a value from values.yaml.
configmap:
  NODE_ENV: "production"
  CORE_SERVICE_PORT: "4005"
  USER_SERVICE_URL: "http://request-user-service.request-management-sit.svc.cluster.local:8884/api/v1"
  KEYCLOAK_BASE_URL: "https://auth-request-management-sit.osd.co.th"
  KEYCLOAK_REALM: "enterprise-request"
  # TEMPORARY — see main.ts's comment on KEYCLOAK_TLS_INSECURE. Wider blast
  # radius here than user-service's equivalent flag (process-wide, not
  # scoped to one HttpService — api-key.service.ts's Keycloak call uses the
  # global `fetch`). Remove once request-management-sit-auth-tls carries a
  # real certificate. Must never be set in values-uat.yaml / values-prod.yaml.
  KEYCLOAK_TLS_INSECURE: "true"
  INTEGRATION_CLIENT_ID: "request-integration"
  ODOO_MODE: "mock"
  PDPA_MODE: "mock"
  METABASE_SITE_URL: ""
  METABASE_DASHBOARD_REQUEST: "2"
  METABASE_DASHBOARD_APPROVAL: "3"
  METABASE_DASHBOARD_SLA: "4"

secrets:
  DATABASE_URL: ""
  INTEGRATION_CLIENT_SECRET: ""
  METABASE_EMBED_SECRET: ""

hostAliases:
  - ip: "10.134.1.5"
    hostnames:
      - "request-management-sit.osd.co.th"
      - "auth-request-management-sit.osd.co.th"

resources:
  requests:
    memory: "192Mi"
    cpu: "50m"
  limits:
    memory: "384Mi"
    cpu: "300m"
