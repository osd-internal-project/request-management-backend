# external-service (NestJS, port 3003). ClusterIP only: the frontend calls it server-side over the cluster network.
appName: request-external-service
ingressName: request-external-service-ingress
configmapName: request-external-service-config
secretName: request-external-service-secret
namespace: request-management

replicaCount: 1

image:
  # The pipeline overrides repository and tag (--set image.repository / image.tag).
  repository: swr.ap-southeast-2.myhuaweicloud.com/osd-internal/request-external-be
  tag: "1.0.0"
  pullPolicy: IfNotPresent

imagePullSecretName: huawei-swr-secret

containerPort: 3003

strategy:
  rollingUpdate:
    maxSurge: 1
    maxUnavailable: 0

service:
  type: ClusterIP
  port: 8886
  targetPort: 3003

# No public ingress: nothing outside the cluster calls this service directly.
ingress:
  enabled: false

configmap:
  STORAGE_MODE: "minio"
  MINIO_ENDPOINT: "obs.ap-southeast-2.myhuaweicloud.com"
  MINIO_PORT: "443"
  MINIO_USE_SSL: "true"
  MINIO_BUCKET: "aiyara"
  NODE_ENV: "production"
  EXTERNAL_SERVICE_PORT: "3003"
  USER_SERVICE_URL: "http://request-user-service.request-management.svc.cluster.local:8884/api/v1"
  RUN_NUMBER_SERVICE_URL: "http://request-run-number-service.request-management.svc.cluster.local:8887/api/v1"
  KEYCLOAK_BASE_URL: "https://auth-events-uat.osd.co.th"
  KEYCLOAK_REALM: "enterprise-request-uat"
  INTEGRATION_CLIENT_ID: "request-integration"
  PUBLIC_WEB_URL: "https://ctd-uat.osd.co.th"
  PUBLIC_BASE_URL: "https://ctd-uat.osd.co.th"
  PDPA_MODE: "mock"

# Committed file: every value stays empty. Real values arrive as --set-string secrets.X from the pipeline.
secrets:
  MINIO_ACCESSKEY: ""
  MINIO_SECRETKEY: ""
  DATABASE_URL: ""
  INTEGRATION_CLIENT_SECRET: ""

# The runtime image has no Prisma CLI, so there is no migration hook. Apply migrations by hand:
#   DATABASE_URL=<url> yarn prisma:migrate:deploy
migration:
  enabled: false

autoscaling:
  enabled: false

# main.ts: setGlobalPrefix('api/v1'); GET /api/v1/health
livenessProbe:
  enabled: true
  path: /api/v1/health
  initialDelaySeconds: 30
  periodSeconds: 10
  timeoutSeconds: 5

readinessProbe:
  enabled: true
  path: /api/v1/health
  initialDelaySeconds: 10
  periodSeconds: 5
  timeoutSeconds: 3

resources:
  requests:
    memory: "256Mi"
    cpu: "25m"
  limits:
    memory: "512Mi"
    cpu: "500m"
