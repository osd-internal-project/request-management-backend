# user-service (NestJS, port 3001). ClusterIP only: the frontend calls it server-side over the cluster network.
appName: request-user-service
ingressName: request-user-service-ingress
configmapName: request-user-service-config
secretName: request-user-service-secret
namespace: request-management

replicaCount: 1

image:
  # The pipeline overrides repository and tag (--set image.repository / image.tag).
  repository: swr.ap-southeast-2.myhuaweicloud.com/osd-internal/request-user-be
  tag: "1.0.0"
  pullPolicy: IfNotPresent

imagePullSecretName: huawei-swr-secret

containerPort: 3001

strategy:
  rollingUpdate:
    maxSurge: 1
    maxUnavailable: 0

service:
  type: ClusterIP
  port: 8884
  targetPort: 3001

# No public ingress: nothing outside the cluster calls this service directly.
ingress:
  enabled: false

configmap:
  NODE_ENV: "production"
  USER_SERVICE_PORT: "3001"
  KEYCLOAK_BASE_URL: "https://auth-events-uat.osd.co.th"
  KEYCLOAK_REALM: "enterprise-request-uat"
  KEYCLOAK_CLIENT_ID: "request-form"
  KEYCLOAK_REDIRECT_URI: "https://ctd-uat.osd.co.th/api/auth/callback"
  KEYCLOAK_POST_LOGOUT_REDIRECT_URI: "https://ctd-uat.osd.co.th/"
  INTEGRATION_CLIENT_ID: "request-integration"

# Committed file: every value stays empty. Real values arrive as --set-string secrets.X from the pipeline.
secrets:
  DATABASE_URL: ""
  KEYCLOAK_CLIENT_SECRET: ""

# The runtime image has no Prisma CLI, so there is no migration hook. Apply migrations by hand:
#   DATABASE_URL=<url> yarn prisma:migrate:deploy
migration:
  enabled: false

autoscaling:
  enabled: false

# main.ts: setGlobalPrefix('api/v1'); GET /api/v1/health
livenessProbe:
  enabled: true
  path: /api/v1/health
  initialDelaySeconds: 30
  periodSeconds: 10
  timeoutSeconds: 5

readinessProbe:
  enabled: true
  path: /api/v1/health
  initialDelaySeconds: 10
  periodSeconds: 5
  timeoutSeconds: 3

resources:
  requests:
    memory: "256Mi"
    cpu: "25m"
  limits:
    memory: "512Mi"
    cpu: "500m"
