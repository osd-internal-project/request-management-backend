namespace: request-management-uat

replicaCount: 1

ingress:
  host: request-management-uat.osd.co.th
  tls:
    enabled: true
    secretName: request-management-uat-tls

# Helm merges maps key by key, so the WHOLE map is written in every env file —
# a partial one silently keeps a value from values.yaml.
configmap:
  NODE_ENV: "production"
  USER_SERVICE_PORT: "4004"
  KEYCLOAK_BASE_URL: "https://auth-request-management-uat.osd.co.th"
  KEYCLOAK_REALM: "enterprise-request-uat"
  KEYCLOAK_CLIENT_ID: "request-form"

secrets:
  DATABASE_URL: ""
  KEYCLOAK_CLIENT_SECRET: ""

hostAliases:
  - ip: "10.134.1.5"
    hostnames:
      - "request-management-uat.osd.co.th"
      - "auth-request-management-uat.osd.co.th"

resources:
  requests:
    memory: "256Mi"
    cpu: "100m"
  limits:
    memory: "512Mi"
    cpu: "500m"
